name: Deploy MinaDental Unified Release (Web PWA + Signed Android APK)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap_first_release:
        description: 'Set true ONLY on initial migration from legacy GitHub Pages root to GitHub Actions'
        required: false
        default: false
        type: boolean
      allow_debug_preview:
        description: 'Allow non-stable QA debug-signed APK preview if upload keystore secrets are not yet configured'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "minadental-unified-release"
  cancel-in-progress: false

jobs:
  allocate_and_build_web:
    name: 1. Allocate Monotonic Sequence, Build & Verify Web PWA
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.build.outputs.release_id }}
      release_sequence: ${{ steps.seq.outputs.value }}
      semver: ${{ steps.build.outputs.semver }}
      git_commit: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install lockfile dependencies
        run: npm ci

      - name: Secret & private-key leak scan
        run: |
          if grep -rnE "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|service_role|SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"][^'\"]+['\"]" src/ public/ index.html; then
            echo "ERROR: Potential secret or private key detected in client source!"
            exit 1
          fi

      - name: Verify Web <-> Android version parity before build
        run: npm run sync:version:check

      - name: Production Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Compute strict monotonic CI release sequence (authoritative for Web + Android)
        id: seq
        env:
          MINA_BASE_SEQUENCE: '224'
          MINA_BOOTSTRAP_FIRST_RELEASE: ${{ inputs.bootstrap_first_release || 'false' }}
        run: |
          node scripts/ci-release-gate.mjs --compute-sequence --remote-pointer https://galaxy1364.github.io/Dendalcare/release-pointer.json --require-remote-pointer --allow-legacy-root-migration

      - name: Mandatory Pre-Deploy TypeScript Typecheck
        run: npm run typecheck

      - name: Mandatory Deterministic Double-Build & Signed Release Gate (CI Identity)
        id: build
        env:
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          MINA_RELEASE_CHANNEL: 'stable'
          MINA_GIT_COMMIT: ${{ github.sha }}
          MINA_SIGNING_PRIVATE_KEY_JWK: ${{ secrets.MINA_SIGNING_PRIVATE_KEY_JWK }}
          MINA_SIGNING_KEY_ID: ${{ secrets.MINA_SIGNING_KEY_ID }}
          VITE_PINNED_RELEASE_KEYS_JSON: ${{ vars.VITE_PINNED_RELEASE_KEYS_JSON }}
          VITE_ANDROID_PLAY_STORE_URL: ${{ vars.VITE_ANDROID_PLAY_STORE_URL }}
          VITE_IOS_APP_STORE_URL: ${{ vars.VITE_IOS_APP_STORE_URL }}
        run: |
          npm run build
          rm -rf dist-check-a
          cp -r dist dist-check-a
          npm run build
          node scripts/ci-release-gate.mjs --compare dist-check-a dist
          rm -rf dist-check-a
          node scripts/ci-release-gate.mjs --verify-local dist --require-ci-origin --verify-parity
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("dist/release-manifest.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${m.releaseId}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `semver=${m.semver}\n`);
          '

      - name: Generate CycloneDX SBOM Artifact
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file dist/sbom.cdx.json

      - name: Mandatory Pre-Deploy Inline Syntax, Hygiene & Subpath Asset Graph Gate
        run: npm run verify:assets

      - name: Mandatory Pre-Deploy Unit, Audit & Release Assurance Tests
        run: npm test

      - name: Install Playwright Browsers (Chromium & WebKit on Ubuntu 24.04)
        run: npx playwright install --with-deps chromium webkit

      - name: Mandatory Pre-Deploy Real Browser E2E Verification
        run: npm run test:e2e

      - name: Upload verified Web PWA dist bundle for synchronized deployment
        uses: actions/upload-artifact@v4
        with:
          name: minadental-web-dist-${{ steps.seq.outputs.value }}
          path: dist/
          retention-days: 14

  build_verify_and_publish_android:
    name: 2. Build, Sign, Verify (apksigner + keytool) & Publish Coherent Android APK
    runs-on: ubuntu-24.04
    needs: allocate_and_build_web
    outputs:
      apk_published: ${{ steps.sign_policy.outputs.can_publish }}
      apk_sha256: ${{ steps.verify_apk.outputs.sha256 }}
      signing_mode: ${{ steps.sign_policy.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Evaluate Android signing policy (prohibit debug signing in stable releases)
        id: sign_policy
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALLOW_DEBUG_PREVIEW: ${{ inputs.allow_debug_preview || 'false' }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
            echo "mode=release_upload_keystore" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:app:assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "forbid_debug_flag=--forbid-debug-signing" >> "$GITHUB_OUTPUT"
            echo "release_tag=android-latest" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_DEBUG_PREVIEW" = "true" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
            echo "mode=qa_debug_preview_keystore" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:app:assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "forbid_debug_flag=" >> "$GITHUB_OUTPUT"
            echo "release_tag=android-debug-preview" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "mode=blocked_missing_release_keystore" >> "$GITHUB_OUTPUT"
            echo "NOTICE: Stable Android APK signing requires ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets. Debug signing is strictly prohibited in stable releases." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js 22
        if: steps.sign_policy.outputs.can_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        if: steps.sign_policy.outputs.can_publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: steps.sign_policy.outputs.can_publish == 'true'
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        if: steps.sign_policy.outputs.can_publish == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download exact verified Web dist bundle from Job 1 into app/src/main/assets/www
        if: steps.sign_policy.outputs.can_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: minadental-web-dist-${{ needs.allocate_and_build_web.outputs.release_sequence }}
          path: dist

      - name: Sync Web dist into Android WebView assets & prepare keystore
        if: steps.sign_policy.outputs.can_publish == 'true'
        env:
          SIGNING_MODE: ${{ steps.sign_policy.outputs.mode }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r dist/. app/src/main/assets/www/
          if [ "$SIGNING_MODE" = "release_upload_keystore" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          elif [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Assemble signed Android APK with synchronized MINA_RELEASE_SEQUENCE
        if: steps.sign_policy.outputs.can_publish == 'true'
        env:
          MINA_RELEASE_SEQUENCE: ${{ needs.allocate_and_build_web.outputs.release_sequence }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle ${{ steps.sign_policy.outputs.gradle_task }} --no-daemon --stacktrace

      - name: Emit apk-release.json (env vars before node) & verify via apksigner + keytool
        id: verify_apk
        if: steps.sign_policy.outputs.can_publish == 'true'
        env:
          APK_PATH: ${{ steps.sign_policy.outputs.apk_path }}
          SIGNING_MODE: ${{ steps.sign_policy.outputs.mode }}
          RELEASE_TAG: ${{ steps.sign_policy.outputs.release_tag }}
          FORBID_DEBUG_FLAG: ${{ steps.sign_policy.outputs.forbid_debug_flag }}
          MINA_RELEASE_SEQUENCE: ${{ needs.allocate_and_build_web.outputs.release_sequence }}
          GIT_SHA: ${{ github.sha }}
          GITHUB_RUN_ID_VAL: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -f "$APK_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ]; then
            yes | sdkmanager "build-tools;35.0.0" >/dev/null || true
            APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          fi
          test -n "$APKSIGNER"

          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          CERT_SHA256=$(echo "$VERIFY_OUT" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          test -n "$CERT_SHA256"

          mkdir -p release-apk
          cp "$APK_PATH" release-apk/MinaDental-android.apk
          cp "$APK_PATH" release-apk/DentalCare.apk

          APK_SHA256=$(sha256sum release-apk/MinaDental-android.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s release-apk/MinaDental-android.apk)
          echo "${APK_SHA256}  MinaDental-android.apk" > release-apk/MinaDental-android.apk.sha256

          # GE-0008: Export metadata env vars strictly BEFORE invoking node!
          export APK_SHA256 APK_SIZE CERT_SHA256
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const webMeta = JSON.parse(fs.readFileSync("dist/version.json", "utf8"));
            const versionCode = Number(process.env.MINA_RELEASE_SEQUENCE || webMeta.releaseSequence);
            const versionName = String(pkg.version);
            const tag = process.env.RELEASE_TAG || "android-latest";
            const meta = {
              schemaVersion: 1,
              appName: "MinaDental",
              applicationId: "com.aistudio.auditpro.kxmfzq",
              versionName,
              versionCode,
              releaseSequence: versionCode,
              releaseId: webMeta.releaseId,
              gitCommit: process.env.GIT_SHA,
              ciRunId: process.env.GITHUB_RUN_ID_VAL,
              fileName: "MinaDental-android.apk",
              sizeBytes: Number(process.env.APK_SIZE),
              sha256: process.env.APK_SHA256,
              signingMode: process.env.SIGNING_MODE,
              signingCertSha256: process.env.CERT_SHA256,
              downloadUrl: `https://github.com/galaxy1364/Dendalcare/releases/download/${tag}/MinaDental-android.apk`,
              compatDownloadUrl: `https://github.com/galaxy1364/Dendalcare/releases/download/${tag}/DentalCare.apk`,
              releasePageUrl: `https://github.com/galaxy1364/Dendalcare/releases/tag/${tag}`,
              publishedAt: new Date().toISOString(),
            };
            fs.writeFileSync("release-apk/apk-release.json", JSON.stringify(meta, null, 2) + "\n", "utf8");
          '

          node scripts/verify-apk-artifact.mjs \
            --apk release-apk/MinaDental-android.apk \
            --metadata release-apk/apk-release.json \
            --require-apksigner \
            --require-keytool \
            $FORBID_DEBUG_FLAG \
            --report release-apk/apk-verification-report.json

          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK & verification build report artifact
        if: steps.sign_policy.outputs.can_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minadental-android-apk-${{ needs.allocate_and_build_web.outputs.release_sequence }}
          path: |
            release-apk/MinaDental-android.apk
            release-apk/MinaDental-android.apk.sha256
            release-apk/apk-release.json
            release-apk/apk-verification-report.json
          retention-days: 30

      - name: Publish verified APK, metadata & verification report to GitHub Release
        if: steps.sign_policy.outputs.can_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.sign_policy.outputs.release_tag }}
        run: |
          set -euo pipefail
          NOTES="MinaDental Android APK (Release #${{ needs.allocate_and_build_web.outputs.release_sequence }} / ${{ needs.allocate_and_build_web.outputs.release_id }})

          - Signing mode: ${{ steps.sign_policy.outputs.mode }}
          - Release Sequence / versionCode: #${{ needs.allocate_and_build_web.outputs.release_sequence }}
          - APK SHA-256: \`${{ steps.verify_apk.outputs.sha256 }}\`
          - Signing Certificate SHA-256: \`${{ steps.verify_apk.outputs.cert_sha256 }}\`
          - Size: ${{ steps.verify_apk.outputs.size_bytes }} bytes
          - Shared Source Commit: ${{ github.sha }}
          - CI Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "MinaDental Android APK (${RELEASE_TAG})" --notes "$NOTES"
            gh release upload "$RELEASE_TAG" \
              release-apk/MinaDental-android.apk \
              release-apk/DentalCare.apk \
              release-apk/MinaDental-android.apk.sha256 \
              release-apk/apk-release.json \
              release-apk/apk-verification-report.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-apk/MinaDental-android.apk \
              release-apk/DentalCare.apk \
              release-apk/MinaDental-android.apk.sha256 \
              release-apk/apk-release.json \
              release-apk/apk-verification-report.json \
              --title "MinaDental Android APK (${RELEASE_TAG})" \
              --notes "$NOTES"
          fi

  deploy_pages_and_verify_live:
    name: 3. Deploy Synchronized Web PWA to GitHub Pages & Verify Live HTTP
    runs-on: ubuntu-24.04
    needs:
      - allocate_and_build_web
      - build_verify_and_publish_android
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified Web PWA dist artifact
        uses: actions/download-artifact@v4
        with:
          name: minadental-web-dist-${{ needs.allocate_and_build_web.outputs.release_sequence }}
          path: dist

      - name: Attach coherent same-release apk-release.json (zero stale race)
        if: needs.build_verify_and_publish_android.outputs.apk_published == 'true' && needs.build_verify_and_publish_android.outputs.signing_mode == 'release_upload_keystore'
        uses: actions/download-artifact@v4
        with:
          name: minadental-android-apk-${{ needs.allocate_and_build_web.outputs.release_sequence }}
          pattern: apk-release.json
          path: dist

      - name: Verify shared commit & sequence coherence between Web dist and attached apk-release.json
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_SEQ: ${{ needs.allocate_and_build_web.outputs.release_sequence }}
        run: |
          node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("dist/apk-release.json")) {
              console.log("No stable signed apk-release.json attached in this run; continuing Web PWA deploy.");
              process.exit(0);
            }
            const meta = JSON.parse(fs.readFileSync("dist/apk-release.json", "utf8"));
            if (meta.gitCommit !== process.env.EXPECTED_COMMIT || Number(meta.versionCode) !== Number(process.env.EXPECTED_SEQ)) {
              console.error("Stale APK metadata race detected!", meta);
              process.exit(1);
            }
            console.log("Coherent same-commit Web + Android metadata verified:", meta.versionName, "#" + meta.versionCode, meta.sha256.slice(0, 12));
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified ./dist artifact for GitHub Pages (NEVER branch root!)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-Deploy Live HTTP/MIME/SHA-256 Verification (with CDN propagation retry)
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE_ID: ${{ needs.allocate_and_build_web.outputs.release_id }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Post-deploy verification attempt $attempt/6 for $DEPLOYED_URL ($EXPECTED_RELEASE_ID)..."
            if node scripts/ci-release-gate.mjs --verify-remote "$DEPLOYED_URL" --expected-release-id "$EXPECTED_RELEASE_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Waiting 5s for GitHub Pages CDN propagation..."
              sleep 5
            fi
          done
          echo "ERROR: Post-deploy remote verification failed after 6 attempts."
          exit 1
