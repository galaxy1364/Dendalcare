name: Deploy MinaDental to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_verify_and_deploy:
    name: Build, Verify Release Gates & Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install lockfile dependencies
        run: npm ci

      - name: Mandatory Pre-Deploy TypeScript Typecheck
        run: npm run typecheck

      - name: Mandatory Deterministic Production Build
        run: npm run build

      - name: Mandatory Pre-Deploy Inline Syntax, Hygiene & Subpath Asset Graph Gate
        run: npm run verify:assets

      - name: Mandatory Pre-Deploy Unit & Audit Tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified ./dist artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
