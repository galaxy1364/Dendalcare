name: MinaDental V9 Continuous Verification CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: minadental-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Deterministic Build, Font/Asset Graph & Playwright E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean dependency install
        run: npm ci

      - name: Secret & private-key leak scan
        run: |
          if grep -rnE "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|service_role|SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"][^'\"]+['\"]" src/ public/ index.html; then
            echo "ERROR: Potential secret or private key detected in client source!"
            exit 1
          fi

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build (CI verification identity)
        env:
          MINA_RELEASE_SEQUENCE: '9000'
          MINA_RELEASE_CHANNEL: 'staging'
          MINA_GIT_COMMIT: ${{ github.sha }}
        run: |
          npm run sync:version
          npm run build
          node scripts/ci-release-gate.mjs --verify-local dist --require-ci-origin --verify-parity

      - name: Verify inline JS syntax, subpath asset graph, 404.html & font magic bytes
        run: npm run verify:assets

      - name: Run V4 + V5 + V7 + V8 + V9 automated unit & fault-injection tests
        run: npm test

      - name: Install Playwright browsers (Chromium & WebKit on Ubuntu 24.04)
        run: npx playwright install --with-deps chromium webkit

      - name: Run release gate E2E (Chromium + WebKit)
        run: npm run test:e2e

      - name: Preserve architecture visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-browser-screenshots
          path: |
            test-results/**/ge0024a-dark-focus.png
            test-results/**/viewport-*.png
          if-no-files-found: ignore
          retention-days: 14
