name: MinaDental V8 Verified Release Pipeline

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target release channel (staging first, then stable)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - stable
      release_sequence:
        description: 'Optional strict integer monotonic release sequence override'
        required: false
        default: ''
        type: string
      bootstrap_first_release:
        description: 'Allow initial bootstrap ONLY if live release-pointer.json does not exist yet'
        required: false
        default: false
        type: boolean

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-verify-and-package:
    name: Deterministic Double-Build, Secret Scan, SBOM & SHA-256 Gate
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      release_sequence: ${{ steps.meta.outputs.release_sequence }}
      semver: ${{ steps.meta.outputs.semver }}
      content_digest: ${{ steps.meta.outputs.content_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Clean dependency install
        run: npm ci

      - name: Secret & private-key leak scan
        run: |
          if grep -rnE "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|service_role|SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"][^'\"]+['\"]" src/ public/ index.html; then
            echo "ERROR: Potential secret or private key detected in client source!"
            exit 1
          fi

      - name: Compute strict monotonic release sequence against deployed pointer (fail-closed)
        id: seq
        env:
          MINA_BASE_SEQUENCE: '224'
          MINA_RELEASE_SEQUENCE_INPUT: ${{ inputs.release_sequence }}
          MINA_BOOTSTRAP_FIRST_RELEASE: ${{ inputs.bootstrap_first_release }}
        run: |
          node scripts/ci-release-gate.mjs --compute-sequence --remote-pointer https://galaxy1364.github.io/Dendalcare/release-pointer.json --require-remote-pointer --allow-legacy-root-migration

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic production build #1
        env:
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          MINA_RELEASE_CHANNEL: ${{ inputs.channel }}
          MINA_GIT_COMMIT: ${{ github.sha }}
          MINA_PUBLISHED_AT: '2026-01-01T00:00:00.000Z'
          MINA_SIGNING_PRIVATE_KEY_JWK: ${{ secrets.MINA_SIGNING_PRIVATE_KEY_JWK }}
          MINA_SIGNING_KEY_ID: ${{ secrets.MINA_SIGNING_KEY_ID }}
          VITE_PINNED_RELEASE_KEYS_JSON: ${{ vars.VITE_PINNED_RELEASE_KEYS_JSON }}
          VITE_ANDROID_PLAY_STORE_URL: ${{ vars.VITE_ANDROID_PLAY_STORE_URL }}
          VITE_IOS_APP_STORE_URL: ${{ vars.VITE_IOS_APP_STORE_URL }}
        run: |
          npm run build
          rm -rf .determinism-build-1
          cp -r dist .determinism-build-1

      - name: Deterministic production build #2 & byte-level comparison
        env:
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          MINA_RELEASE_CHANNEL: ${{ inputs.channel }}
          MINA_GIT_COMMIT: ${{ github.sha }}
          MINA_PUBLISHED_AT: '2026-01-01T00:00:00.000Z'
          MINA_SIGNING_PRIVATE_KEY_JWK: ${{ secrets.MINA_SIGNING_PRIVATE_KEY_JWK }}
          MINA_SIGNING_KEY_ID: ${{ secrets.MINA_SIGNING_KEY_ID }}
          VITE_PINNED_RELEASE_KEYS_JSON: ${{ vars.VITE_PINNED_RELEASE_KEYS_JSON }}
          VITE_ANDROID_PLAY_STORE_URL: ${{ vars.VITE_ANDROID_PLAY_STORE_URL }}
          VITE_IOS_APP_STORE_URL: ${{ vars.VITE_IOS_APP_STORE_URL }}
        run: |
          npm run build
          node scripts/ci-release-gate.mjs --compare .determinism-build-1 dist
          rm -rf .determinism-build-1

      - name: Final stamped CI release build & metadata export
        id: meta
        env:
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          MINA_RELEASE_CHANNEL: ${{ inputs.channel }}
          MINA_GIT_COMMIT: ${{ github.sha }}
          MINA_SIGNING_PRIVATE_KEY_JWK: ${{ secrets.MINA_SIGNING_PRIVATE_KEY_JWK }}
          MINA_SIGNING_KEY_ID: ${{ secrets.MINA_SIGNING_KEY_ID }}
          VITE_PINNED_RELEASE_KEYS_JSON: ${{ vars.VITE_PINNED_RELEASE_KEYS_JSON }}
          VITE_ANDROID_PLAY_STORE_URL: ${{ vars.VITE_ANDROID_PLAY_STORE_URL }}
          VITE_IOS_APP_STORE_URL: ${{ vars.VITE_IOS_APP_STORE_URL }}
        run: |
          npm run build
          node scripts/ci-release-gate.mjs --verify-local dist --require-ci-origin --verify-parity
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("dist/release-manifest.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_id=${manifest.releaseId}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_sequence=${manifest.releaseSequence}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `semver=${manifest.semver}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `content_digest=${manifest.contentDigest}\n`);
          '

      - name: Dependency audit & CycloneDX SBOM
        run: |
          npm audit --omit=dev --audit-level=high
          npm sbom --sbom-format=cyclonedx > dist/sbom.cdx.json

      - name: Verify inline JS syntax, subpath asset graph, and SHA-256 manifest integrity
        run: npm run verify:assets

      - name: Run Audit + V4 + V5 + V7 + V8 Release Assurance tests
        run: npm test

      - name: Install Playwright browsers (Chromium & WebKit on Ubuntu 24.04)
        run: npx playwright install --with-deps chromium webkit

      - name: Run release gate E2E (Chromium + WebKit)
        run: npm run test:e2e

      - name: Upload verified immutable release bundle
        uses: actions/upload-artifact@v4
        with:
          name: minadental-release-${{ steps.meta.outputs.release_id }}
          path: |
            dist/
            gh-pages-dist/
          retention-days: 30

  staging-promotion-and-health-gate:
    name: Staging Artifact Verification & Coherence Gate
    runs-on: ubuntu-24.04
    needs: build-verify-and-package
    environment:
      name: staging
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: minadental-release-${{ needs.build-verify-and-package.outputs.release_id }}
          path: release-bundle

      - name: Verify staged immutable release directory, pointers & SHA-256 integrity
        run: |
          node scripts/ci-release-gate.mjs --verify-local release-bundle/dist --require-ci-origin

  production-promotion:
    name: Production Promotion & Post-Deploy Live HTTP Verification
    runs-on: ubuntu-24.04
    needs:
      - build-verify-and-package
      - staging-promotion-and-health-gate
    if: ${{ inputs.channel == 'stable' }}
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download verified release bundle
        uses: actions/download-artifact@v4
        with:
          name: minadental-release-${{ needs.build-verify-and-package.outputs.release_id }}
          path: release-bundle

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (complete immutable releases + pointers published atomically)
        uses: actions/upload-pages-artifact@v3
        with:
          path: release-bundle/dist

      - name: Deploy verified release to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-Deploy Live HTTP/MIME/SHA-256 Verification Gate (with CDN propagation retry)
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE_ID: ${{ needs.build-verify-and-package.outputs.release_id }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Post-deploy verification attempt $attempt/6 for $DEPLOYED_URL ($EXPECTED_RELEASE_ID)..."
            if node scripts/ci-release-gate.mjs --verify-remote "$DEPLOYED_URL" --expected-release-id "$EXPECTED_RELEASE_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Waiting 5s for GitHub Pages CDN propagation..."
              sleep 5
            fi
          done
          echo "ERROR: Post-deploy remote verification failed after 6 attempts."
          exit 1
