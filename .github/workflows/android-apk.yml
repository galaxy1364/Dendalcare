name: Build & Verify Signed Android APK (Manual / Standalone)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable strictly requires upload keystore; debug-preview is QA only)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - debug-preview

permissions:
  contents: write

concurrency:
  group: "minadental-production-release"
  cancel-in-progress: false

jobs:
  build_and_publish_apk:
    name: Build, Sign, Verify (apksigner + keytool) & Publish MinaDental Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install lockfile dependencies, sync-check versions & typecheck
        run: |
          npm ci
          npm run sync:version:check
          npm run typecheck

      - name: Compute strict monotonic Web & Android release sequence (aligned with deploy.yml)
        id: seq
        env:
          MINA_BASE_SEQUENCE: '230'
        run: |
          node scripts/ci-release-gate.mjs --compute-sequence --remote-pointer https://galaxy1364.github.io/Dendalcare/release-pointer.json --require-remote-pointer --allow-legacy-root-migration

      - name: Build bundled WebView assets & verify release parity
        env:
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          MINA_RELEASE_CHANNEL: 'stable'
          MINA_GIT_COMMIT: ${{ github.sha }}
        run: |
          npm run sync:version
          npm run build
          node scripts/ci-release-gate.mjs --verify-local dist --require-ci-origin --verify-parity
          npm run verify:assets

      - name: Prepare signing keystore (stable PROHIBITS debug signing)
        id: sign_mode
        env:
          TARGET_CHANNEL: ${{ inputs.channel || 'debug-preview' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "mode=release_upload_keystore" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:app:assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "forbid_debug_flag=--forbid-debug-signing" >> "$GITHUB_OUTPUT"
            echo "release_tag=android-latest" >> "$GITHUB_OUTPUT"
          elif [ "$TARGET_CHANNEL" = "debug-preview" ]; then
            if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug, O=Android, C=US"
            fi
            echo "mode=qa_debug_preview_keystore" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:app:assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "forbid_debug_flag=" >> "$GITHUB_OUTPUT"
            echo "release_tag=android-debug-preview" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Stable Android release requires ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets. Debug signing is prohibited in stable releases."
            exit 1
          fi

      - name: Assemble signed Android APK with synchronized MINA_RELEASE_SEQUENCE
        env:
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle ${{ steps.sign_mode.outputs.gradle_task }} --no-daemon --stacktrace

      - name: Emit apk-release.json (env vars before node) & run apksigner + keytool verification report
        id: verify_apk
        env:
          APK_PATH: ${{ steps.sign_mode.outputs.apk_path }}
          SIGNING_MODE: ${{ steps.sign_mode.outputs.mode }}
          RELEASE_TAG: ${{ steps.sign_mode.outputs.release_tag }}
          FORBID_DEBUG_FLAG: ${{ steps.sign_mode.outputs.forbid_debug_flag }}
          MINA_RELEASE_SEQUENCE: ${{ steps.seq.outputs.value }}
          GIT_SHA: ${{ github.sha }}
          GITHUB_RUN_ID_VAL: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -f "$APK_PATH"

          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "Installing build-tools for apksigner..."
            yes | sdkmanager "build-tools;35.0.0" >/dev/null || true
            APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          fi
          test -n "$APKSIGNER"

          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          CERT_SHA256=$(printf '%s\n' "$VERIFY_OUT" | node --input-type=module -e 'import { readFileSync } from "node:fs"; import { parseApksignerOutput } from "./scripts/verify-apk-artifact.mjs"; const p = parseApksignerOutput(readFileSync(0, "utf8")); if (!p.verified || !p.signerCertSha256) process.exit(1); console.log(p.signerCertSha256);')
          test -n "$CERT_SHA256"

          mkdir -p release-apk
          cp "$APK_PATH" release-apk/MinaDental-android.apk
          cp "$APK_PATH" release-apk/DentalCare.apk

          APK_SHA256=$(sha256sum release-apk/MinaDental-android.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s release-apk/MinaDental-android.apk)
          echo "${APK_SHA256}  MinaDental-android.apk" > release-apk/MinaDental-android.apk.sha256

          # GE-0008: Export env vars strictly BEFORE node execution!
          export APK_SHA256 APK_SIZE CERT_SHA256
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const webMeta = JSON.parse(fs.readFileSync("dist/version.json", "utf8"));
            const versionCode = Number(process.env.MINA_RELEASE_SEQUENCE || webMeta.releaseSequence || 224);
            const versionName = String(pkg.version);
            const tag = process.env.RELEASE_TAG || "android-latest";
            const meta = {
              schemaVersion: 1,
              appName: "MinaDental",
              applicationId: "com.aistudio.auditpro.kxmfzq",
              versionName,
              versionCode,
              releaseSequence: versionCode,
              releaseId: webMeta.releaseId || `v${versionName}`,
              gitCommit: process.env.GIT_SHA,
              ciRunId: process.env.GITHUB_RUN_ID_VAL,
              fileName: "MinaDental-android.apk",
              sizeBytes: Number(process.env.APK_SIZE),
              sha256: process.env.APK_SHA256,
              signingMode: process.env.SIGNING_MODE,
              signingCertSha256: process.env.CERT_SHA256,
              downloadUrl: `https://github.com/galaxy1364/Dendalcare/releases/download/${tag}/MinaDental-android.apk`,
              compatDownloadUrl: `https://github.com/galaxy1364/Dendalcare/releases/download/${tag}/DentalCare.apk`,
              releasePageUrl: `https://github.com/galaxy1364/Dendalcare/releases/tag/${tag}`,
              publishedAt: new Date().toISOString(),
            };
            fs.writeFileSync("release-apk/apk-release.json", JSON.stringify(meta, null, 2) + "\n", "utf8");
          '

          node scripts/verify-apk-artifact.mjs \
            --apk release-apk/MinaDental-android.apk \
            --metadata release-apk/apk-release.json \
            --require-apksigner \
            --require-keytool \
            $FORBID_DEBUG_FLAG \
            --report release-apk/apk-verification-report.json

          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK & verification report workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: minadental-signed-android-apk
          path: |
            release-apk/MinaDental-android.apk
            release-apk/MinaDental-android.apk.sha256
            release-apk/apk-release.json
            release-apk/apk-verification-report.json
          retention-days: 30

      - name: Publish signed APK & verification report to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.sign_mode.outputs.release_tag }}
        run: |
          set -euo pipefail
          NOTES="MinaDental Signed Android APK (Release #${{ steps.seq.outputs.value }})

          - Signing mode: ${{ steps.sign_mode.outputs.mode }}
          - Release Sequence / versionCode: #${{ steps.seq.outputs.value }}
          - APK SHA-256: \`${{ steps.verify_apk.outputs.sha256 }}\`
          - Signing Certificate SHA-256: \`${{ steps.verify_apk.outputs.cert_sha256 }}\`
          - Size: ${{ steps.verify_apk.outputs.size_bytes }} bytes
          - Commit: ${{ github.sha }}
          - CI Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Preserve the prior stable APK and publish a permanent version tag before updating the alias.
          if [ "$RELEASE_TAG" = "android-latest" ]; then
            node scripts/archive-android-release.mjs
          fi
          VERSION_TITLE=$(node -e 'const m=require("./release-apk/apk-release.json"); console.log("MinaDental Android "+m.versionName+" — #"+m.releaseSequence+" ("+process.env.RELEASE_TAG+")")')
          NOTES="${NOTES}

          [Download APK / دانلود مستقیم](https://github.com/galaxy1364/Dendalcare/releases/download/${RELEASE_TAG}/MinaDental-android.apk)

          [All versions / تمام نسخه‌ها](https://github.com/galaxy1364/Dendalcare/releases)"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$VERSION_TITLE" --notes "$NOTES"
            gh release upload "$RELEASE_TAG" \
              release-apk/MinaDental-android.apk \
              release-apk/DentalCare.apk \
              release-apk/MinaDental-android.apk.sha256 \
              release-apk/apk-release.json \
              release-apk/apk-verification-report.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-apk/MinaDental-android.apk \
              release-apk/DentalCare.apk \
              release-apk/MinaDental-android.apk.sha256 \
              release-apk/apk-release.json \
              release-apk/apk-verification-report.json \
              --title "$VERSION_TITLE" \
              --notes "$NOTES"
          fi
