  <!-- V8.1 Incident P0: Pre-React error/unhandledrejection listeners & cancellable watchdog MUST attach BEFORE entry module -->
  <script>
    (function () {
      window.__deferredInstallPrompt = null;
      window.__minaAppMounted = false;
      window.__minaBootState = 'BOOTING';
      window.__minaBootMilestones = {
        htmlParsedAt: Date.now(),
        moduleEvaluatedAt: null,
        shellCommittedAt: null,
        authResolvedAt: null,
        routeRenderedAt: null,
        readyAt: null,
      };

      var metaBuild = document.querySelector('meta[name="minadental-build-id"]');
      var buildId = (metaBuild && metaBuild.getAttribute('content')) || 'dev-local';
      if (buildId.indexOf('__MINA_') === 0) buildId = 'dev-local';
      window.__minaBuildId = buildId;

      var metaSeq = document.querySelector('meta[name="minadental-release-seq"]');
      var releaseSeq = (metaSeq && metaSeq.getAttribute('content')) || '0';
      if (releaseSeq.indexOf('__MINA_') === 0) releaseSeq = '0';

      var metaDigest = document.querySelector('meta[name="minadental-content-digest"]');
      var contentDigest = (metaDigest && metaDigest.getAttribute('content')) || '';
      if (contentDigest.indexOf('__MINA_') === 0) contentDigest = '';
      window.__minaContentDigest = contentDigest;

      function makeBootCorrelationId() {
        return 'boot_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function sanitizeBootText(raw) {
        return String(raw || '')
          .replace(/Bearer\s+[A-Za-z0-9\-._~+/]+=*/gi, 'Bearer [REDACTED]')
          .replace(/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/g, '[JWT_REDACTED]')
          .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[EMAIL_REDACTED]')
          .replace(/\b09\d{9}\b/g, '[PHONE_REDACTED]')
          .slice(0, 140);
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('minadental:installed'));
      });

      // Pre-hydrate theme mode before first paint to prevent light/dark flash
      try {
        var savedMode = localStorage.getItem('minadental_theme_mode');
        if (savedMode === 'dark' || savedMode === 'light') {
          document.documentElement.setAttribute('data-theme', savedMode);
          if (savedMode === 'dark') document.documentElement.classList.add('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}

      function showBootFallback(code, detail) {
        if (window.__minaAppMounted && window.__minaBootState !== 'BOOTING' && code === 'BOOT_WATCHDOG_TIMEOUT') return;
        var el = document.getElementById('boot-error');
        var metaEl = document.getElementById('boot-error-meta');
        var cid = makeBootCorrelationId();
        var safeCode = code || 'BOOT_STARTUP_FAILED';
        var safeDetail = sanitizeBootText(detail || '');
        if (metaEl) {
          metaEl.textContent =
            'CODE=' + safeCode +
            ' | ID=' + cid +
            ' | BUILD=' + buildId +
            ' (#' + releaseSeq + ')' +
            (safeDetail ? ' | ' + safeDetail : '');
        }
        if (el) el.style.display = 'block';
      }
      window.__minaShowBootRecovery = showBootFallback;

      var simpleReloadBtn = document.getElementById('boot-simple-reload-btn');
      if (simpleReloadBtn) {
        simpleReloadBtn.addEventListener('click', function () {
          window.location.reload();
        });
      }

      // Safe recovery: ONLY clear minadental-* CacheStorage & unregister SW.
      // NEVER touch IndexedDB, localStorage patient data, auth tokens, or offline mutation queue.
      var retryBtn = document.getElementById('boot-retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          var cleanupTasks = [];
          try {
            if ('serviceWorker' in navigator) {
              cleanupTasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
            if ('caches' in window) {
              cleanupTasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(
                    keys
                      .filter(function (k) { return k.indexOf('minadental-') === 0; })
                      .map(function (k) { return caches.delete(k); })
                  );
                })
              );
            }
          } catch (e) {}
          Promise.allSettled(cleanupTasks).finally(function () {
            window.location.reload();
          });
        });
      }

      window.addEventListener('error', function (ev) {
        if (window.__minaAppMounted) return;
        if (ev && ev.target && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK')) {
          var src = ev.target.src || ev.target.href || ev.target.tagName;
          showBootFallback('ASSET_LOAD_ERROR', src);
          return;
        }
        if (ev && (ev.message || ev.error)) {
          showBootFallback('BOOT_RUNTIME_ERROR', ev.message || (ev.error && ev.error.message));
        }
      }, true);

      window.addEventListener('unhandledrejection', function (ev) {
        if (!window.__minaAppMounted) {
          var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Promise rejected';
          showBootFallback('BOOT_UNHANDLED_REJECTION', reason);
        }
      });

      // Cancellable 12s watchdog (cancelled immediately by markShellCommitted() on valid React commit)
      window.__minaBootWatchdogTimer = setTimeout(function () {
        var ms = window.__minaBootMilestones || {};
        var stageHint = ms.moduleEvaluatedAt ? 'module_evaluated_no_commit' : 'entry_module_not_loaded';
        showBootFallback('BOOT_WATCHDOG_TIMEOUT', stageHint);
      }, 12000);

      window.__minaCancelBootWatchdog = function () {
        if (window.__minaBootWatchdogTimer) {
          clearTimeout(window.__minaBootWatchdogTimer);
          window.__minaBootWatchdogTimer = null;
        }
      };

      // Controlled Service Worker lifecycle (zero abrupt reload loops)
      var isNativeWebView =
        window.location.protocol === 'file:' ||
        window.location.hostname === 'appassets.androidplatform.net' ||
        (window.location.hostname === '127.0.0.1' && window.location.port === '8765') ||
        /MinaDentalAndroid/i.test(navigator.userAgent || '');

      if ('serviceWorker' in navigator && !isNativeWebView && window.location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', function () {
          // V7/V8: NEVER force an abrupt reload on raw controllerchange outside UpdateCoordinator safe-point.
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            window.dispatchEvent(
              new CustomEvent('minadental:sw-controllerchange', {
                detail: { buildId: buildId },
              })
            );
          });

          navigator.serviceWorker.addEventListener('message', function (event) {
            if (event && event.data && event.data.type === 'SW_UPDATE_READY') {
              window.dispatchEvent(
                new CustomEvent('minadental:sw-update-available', {
                  detail: { buildId: event.data.buildId || buildId },
                })
              );
            }
          });

          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              if (reg.waiting) {
                window.dispatchEvent(
                  new CustomEvent('minadental:sw-update-available', {
                    detail: { buildId: buildId, registration: reg },
                  })
                );
              }
              reg.addEventListener('updatefound', function () {
                var installing = reg.installing;
                if (!installing) return;
                installing.addEventListener('statechange', function () {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(
                      new CustomEvent('minadental:sw-update-available', {
                        detail: { buildId: buildId, registration: reg },
                      })
                    );
                  }
                });
              });
            })
            .catch(function () {});
        });
      }
    })();
