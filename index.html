<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#087C76" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A141E" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="مینادنتال" />
  <meta name="application-name" content="مینادنتال" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="مینادنتال — پلتفرم یکپارچه مدیریت کلینیک دندانپزشکی با طراحی سیستماتیک، تقویم شمسی و گزارش‌گیری دقیق مالی" />
  <meta name="minadental-build-id" content="__MINA_BUILD_ID_VALUE__" />
  <meta name="minadental-release-seq" content="__MINA_RELEASE_SEQ_VALUE__" />
  <meta name="minadental-semver" content="__MINA_SEMVER_VALUE__" />
  <meta name="minadental-content-digest" content="__MINA_CONTENT_DIGEST_VALUE__" />
  <title>مینادنتال | مدیریت هوشمند کلینیک دندانپزشکی</title>

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />

  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #F4F7F9;
      color: #14283B;
      font-family: 'Vazirmatn', 'Tahoma', 'SF Pro Display', 'IRANSansX', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]), html:not([data-theme="light"]) body, html:not([data-theme="light"]) #root {
        background-color: #0A141E;
        color: #F1F5F9;
      }
    }
    html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root {
      background-color: #0A141E;
      color: #F1F5F9;
    }
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #F4F7F9;
      z-index: 9998;
      transition: opacity 0.25s ease;
    }
    html[data-theme="dark"] #app-splash {
      background: #0A141E;
    }
    .splash-logo {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(8, 124, 118, 0.18);
      border: 1px solid #D8E2EA;
      background: #FFFFFF;
    }
    .splash-logo img { width: 100%; height: 100%; object-fit: cover; }
    .splash-title { font-size: 20px; font-weight: 800; color: #14283B; }
    html[data-theme="dark"] .splash-title { color: #F1F5F9; }
    .splash-sub { font-size: 12px; font-weight: 600; color: #526779; }
    html[data-theme="dark"] .splash-sub { color: #9FB1C1; }
    .splash-bar { width: 152px; height: 4px; border-radius: 99px; background: #D8E2EA; overflow: hidden; }
    .splash-fill { width: 42%; height: 100%; background: #087C76; border-radius: 99px; animation: splashSlide 1.1s ease-in-out infinite; }
    .splash-bar.splash-stopped .splash-fill { width: 100%; background: #AD293C; animation: none; transform: none; }
    @keyframes splashSlide {
      0% { transform: translateX(120%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(-140%); }
    }
    /* V9 Independent Recovery Container (strictly outside #app-splash and #root) */
    #boot-error {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      margin: 0 auto;
      padding: 16px;
      border-radius: 18px;
      background: #FFF1F2;
      border: 1px solid #FECDD3;
      color: #AD293C;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      max-width: 380px;
      line-height: 1.75;
      z-index: 10000;
      box-shadow: 0 18px 40px rgba(20, 40, 59, 0.18);
    }
    html[data-theme="dark"] #boot-error {
      background: #2C1219;
      border-color: #7F1D1D;
      color: #FDA4AF;
    }
    #boot-error-meta {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      color: #475569;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      direction: ltr;
      word-break: break-word;
    }
    html[data-theme="dark"] #boot-error-meta {
      background: rgba(15, 23, 42, 0.65);
      color: #CBD5E1;
    }
    .boot-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    #boot-simple-reload-btn, #boot-copy-diag-btn {
      padding: 10px 14px;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #14283B;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #boot-retry-btn {
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 12px;
      border: none;
      background: #087C76;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="app-splash" aria-label="در حال راه‌اندازی مینادنتال">
    <div class="splash-logo">
      <img src="./icon-192.png" alt="مینادنتال" />
    </div>
    <div class="splash-title">مینادنتال</div>
    <div id="splash-sub" class="splash-sub">در حال راه‌اندازی سامانه کلینیک...</div>
    <div id="splash-bar" class="splash-bar"><div class="splash-fill"></div></div>
  </div>

  <!-- V9 Independent Recovery UI Container outside both #app-splash and #root -->
  <div id="boot-error" role="alert" aria-live="assertive" data-testid="boot_recovery_overlay">
    <div id="boot-error-title">بارگذاری هسته برنامه کامل نشد. حافظه محلی دستگاه (IndexedDB و صف آفلاین) در این بازیابی پاک نمی‌شود.</div>
    <div id="boot-error-meta">CODE=BOOT_PENDING</div>
    <div class="boot-actions">
      <button id="boot-simple-reload-btn" type="button">تلاش مجدد</button>
      <button id="boot-retry-btn" type="button">بازیابی ایمن کش پوسته</button>
      <button id="boot-copy-diag-btn" type="button">کپی گزارش فنی</button>
    </div>
  </div>

  <div id="root"></div>

  <!-- V9 P0.2-P0.4: Pre-React non-fatal asset classification, root-cause lock, scope-precise safe recovery & cancellable watchdog -->
  <script>
    (function () {
      window.__deferredInstallPrompt = null;
      window.__minaAppMounted = false;
      window.__minaBootState = 'BOOTING';
      window.__minaBootWarnings = [];
      window.__minaBootFatalRootCause = null;
      window.__minaBootMilestones = {
        htmlParsedAt: Date.now(),
        moduleEvaluatedAt: null,
        shellCommittedAt: null,
        authResolvedAt: null,
        routeRenderedAt: null,
        readyAt: null,
      };

      var metaBuild = document.querySelector('meta[name="minadental-build-id"]');
      var buildId = (metaBuild && metaBuild.getAttribute('content')) || 'dev-local';
      if (buildId.indexOf('__MINA_') === 0) buildId = 'dev-local';
      window.__minaBuildId = buildId;

      var metaSeq = document.querySelector('meta[name="minadental-release-seq"]');
      var releaseSeq = (metaSeq && metaSeq.getAttribute('content')) || '0';
      if (releaseSeq.indexOf('__MINA_') === 0) releaseSeq = '0';

      var metaDigest = document.querySelector('meta[name="minadental-content-digest"]');
      var contentDigest = (metaDigest && metaDigest.getAttribute('content')) || '';
      if (contentDigest.indexOf('__MINA_') === 0) contentDigest = '';
      window.__minaContentDigest = contentDigest;

      function getAppBasePath() {
        try {
          var p = (window.location && window.location.pathname) || '/';
          if (p.indexOf('/Dendalcare') === 0) return '/Dendalcare/';
          var lastSlash = p.lastIndexOf('/');
          return lastSlash >= 0 ? p.slice(0, lastSlash + 1) : '/';
        } catch (e) {
          return '/';
        }
      }

      function makeBootCorrelationId() {
        return 'boot_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      }

      function sanitizeBootText(raw) {
        return String(raw || '')
          .replace(/Bearer\s+[A-Za-z0-9\-._~+/]+=*/gi, 'Bearer [REDACTED]')
          .replace(/eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}/g, '[JWT_REDACTED]')
          .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[EMAIL_REDACTED]')
          .replace(/\b09\d{9}\b/g, '[PHONE_REDACTED]')
          .replace(/(apikey|api_key|token|password|secret)=[^&\s]+/gi, '$1=[REDACTED]')
          .slice(0, 140);
      }

      function recordNonFatalWarning(code, detail) {
        try {
          var list = window.__minaBootWarnings;
          if (Array.isArray(list) && list.length < 30) {
            list.push({
              code: String(code || 'NONFATAL_WARNING'),
              detail: sanitizeBootText(detail || ''),
              at: Date.now(),
            });
          }
        } catch (e) {}
      }
      window.__minaRecordBootWarning = recordNonFatalWarning;

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('minadental:installed'));
      });

      // Pre-hydrate theme mode before first paint to prevent light/dark flash
      try {
        var savedMode = localStorage.getItem('minadental_theme_mode');
        if (savedMode === 'dark' || savedMode === 'light') {
          document.documentElement.setAttribute('data-theme', savedMode);
          if (savedMode === 'dark') document.documentElement.classList.add('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}

      function stopSplashSpinner() {
        var bar = document.getElementById('splash-bar');
        if (bar && bar.classList) bar.classList.add('splash-stopped');
        var sub = document.getElementById('splash-sub');
        if (sub) sub.textContent = 'راه‌اندازی با خطا متوقف شد';
      }

      function showBootFallback(code, detail) {
        if (window.__minaAppMounted && window.__minaBootState !== 'BOOTING' && code === 'BOOT_WATCHDOG_TIMEOUT') {
          return;
        }
        // V9 P0.2: Preserve the FIRST real root cause; watchdog MUST NEVER overwrite an existing fatal root cause
        if (window.__minaBootFatalRootCause && code === 'BOOT_WATCHDOG_TIMEOUT') {
          return;
        }
        var safeCode = String(code || 'BOOT_STARTUP_FAILED');
        var safeDetail = sanitizeBootText(detail || '');
        if (!window.__minaBootFatalRootCause) {
          window.__minaBootFatalRootCause = {
            code: safeCode,
            detail: safeDetail,
            cid: makeBootCorrelationId(),
            at: Date.now(),
          };
        }
        var rootCause = window.__minaBootFatalRootCause;
        window.__minaBootState = 'ERROR';
        stopSplashSpinner();

        var el = document.getElementById('boot-error');
        var metaEl = document.getElementById('boot-error-meta');
        if (metaEl) {
          metaEl.textContent =
            'CODE=' + rootCause.code +
            ' | ID=' + rootCause.cid +
            ' | BUILD=' + buildId +
            ' (#' + releaseSeq + ')' +
            (rootCause.detail ? ' | ' + rootCause.detail : '');
        }
        if (el) el.style.display = 'block';
      }
      window.__minaShowBootRecovery = showBootFallback;

      /**
       * V9 P0.2 Strict Resource Error Classification:
       * Fonts, icons, manifests, and optional/non-entry stylesheets MUST NEVER be fatal or block boot.
       * Only critical entry JS scripts (or raw .tsx leaked onto static prod host) trigger fatal boot recovery.
       */
      function classifyResourceError(target) {
        if (!target || !target.tagName) return { fatal: false, code: 'UNKNOWN_RESOURCE_WARNING', url: '' };
        var tag = String(target.tagName).toUpperCase();
        var rel = String((target.getAttribute && target.getAttribute('rel')) || target.rel || '').toLowerCase().trim();
        var asAttr = String((target.getAttribute && target.getAttribute('as')) || target.as || '').toLowerCase().trim();
        var rawUrl = String(
          (target.getAttribute && (target.getAttribute('src') || target.getAttribute('href'))) ||
          target.src ||
          target.href ||
          ''
        );
        var lowerUrl = rawUrl.toLowerCase();

        if (tag === 'IMG') {
          return { fatal: false, code: 'IMAGE_LOAD_WARNING', url: rawUrl };
        }

        if (tag === 'LINK') {
          if (
            asAttr === 'font' ||
            /\.(woff2?|ttf|otf|eot)(\?|$|#)/i.test(lowerUrl) ||
            lowerUrl.indexOf('/fonts/') >= 0
          ) {
            return { fatal: false, code: 'FONT_LOAD_WARNING', url: rawUrl };
          }
          if (rel.indexOf('icon') >= 0 || lowerUrl.indexOf('favicon') >= 0 || lowerUrl.indexOf('apple-touch-icon') >= 0) {
            return { fatal: false, code: 'ICON_LOAD_WARNING', url: rawUrl };
          }
          if (rel === 'manifest' || lowerUrl.indexOf('manifest.json') >= 0 || lowerUrl.indexOf('.webmanifest') >= 0) {
            return { fatal: false, code: 'MANIFEST_LOAD_WARNING', url: rawUrl };
          }
          if (rel === 'preload' || rel === 'prefetch' || rel === 'modulepreload' || rel === 'preconnect') {
            return { fatal: false, code: 'PRELOAD_WARNING', url: rawUrl };
          }
          if (rel === 'stylesheet') {
            var isPrimaryCss = lowerUrl.indexOf('/assets/') >= 0 || lowerUrl.indexOf('./assets/') >= 0;
            return {
              fatal: false,
              code: isPrimaryCss ? 'PRIMARY_CSS_DEGRADED' : 'OPTIONAL_CSS_WARNING',
              url: rawUrl,
            };
          }
          return { fatal: false, code: 'OPTIONAL_LINK_WARNING', url: rawUrl };
        }

        if (tag === 'SCRIPT') {
          var isRawTsx = /\.tsx(\?|$|#)/i.test(lowerUrl);
          if (isRawTsx) {
            return { fatal: true, code: 'RAW_TSX_DEPLOY_ERROR', url: rawUrl };
          }
          return { fatal: true, code: 'ENTRY_SCRIPT_LOAD_ERROR', url: rawUrl };
        }

        return { fatal: false, code: 'NONCRITICAL_ASSET_WARNING', url: rawUrl };
      }

      /**
       * V9 P0.2 Unhandled Rejection Classifier:
       * Sync, Supabase, telemetry, update-check, AbortError, and document.fonts rejections MUST NOT make boot fatal.
       */
      function isNonFatalBootRejection(reason) {
        var name = reason && reason.name ? String(reason.name) : '';
        var msg = reason && reason.message ? String(reason.message) : String(reason || '');
        var combined = (name + ' ' + msg).toLowerCase();
        if (name === 'AbortError' || combined.indexOf('aborterror') >= 0) return true;
        if (
          combined.indexOf('supabase') >= 0 ||
          combined.indexOf('release-pointer') >= 0 ||
          combined.indexOf('release-manifest') >= 0 ||
          combined.indexOf('fonts') >= 0 ||
          combined.indexOf('woff2') >= 0 ||
          combined.indexOf('serviceworker') >= 0 ||
          combined.indexOf('notification') >= 0 ||
          combined.indexOf('networkerror') >= 0 ||
          combined.indexOf('failed to fetch') >= 0 ||
          combined.indexOf('load failed') >= 0
        ) {
          return true;
        }
        return false;
      }

      // Safe recovery actions (V9 P0.4: scope-precise SW cleanup, zero IndexedDB/localStorage wipe, reload-loop safe)
      var simpleReloadBtn = document.getElementById('boot-simple-reload-btn');
      if (simpleReloadBtn) {
        simpleReloadBtn.addEventListener('click', function () {
          window.location.reload();
        });
      }

      var copyDiagBtn = document.getElementById('boot-copy-diag-btn');
      if (copyDiagBtn) {
        copyDiagBtn.addEventListener('click', function () {
          var metaEl = document.getElementById('boot-error-meta');
          var text = metaEl ? metaEl.textContent || '' : '';
          if (text && navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              copyDiagBtn.textContent = 'کپی شد';
            }).catch(function () {});
          }
        });
      }

      function runScopedSafeRecovery() {
        var appBasePath = getAppBasePath();
        var appOrigin = (window.location && window.location.origin) || '';
        var expectedScopePrefix = appOrigin ? appOrigin + appBasePath : appBasePath;
        var cleanupTasks = [];

        try {
          // Track per-release recovery attempts to prevent silent reload loops
          var attemptKey = 'minadental_boot_recovery_attempts';
          var attempts = 0;
          try {
            attempts = Number(sessionStorage.getItem(attemptKey) || '0') || 0;
            sessionStorage.setItem(attemptKey, String(attempts + 1));
          } catch (e) {}

          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            cleanupTasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs
                    .filter(function (reg) {
                      var scope = String((reg && reg.scope) || '');
                      return (
                        scope === expectedScopePrefix ||
                        scope.indexOf(expectedScopePrefix) === 0 ||
                        (appBasePath !== '/' && scope.indexOf(appBasePath) >= 0)
                      );
                    })
                    .map(function (reg) {
                      return reg.unregister();
                    })
                );
              })
            );
          }

          if ('caches' in window && caches.keys) {
            cleanupTasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys
                    .filter(function (k) {
                      return k.indexOf('minadental-shell-') === 0 || k.indexOf('minadental-v') === 0;
                    })
                    .map(function (k) {
                      return caches.delete(k);
                    })
                );
              })
            );
          }
        } catch (e) {}

        return Promise.allSettled(cleanupTasks).finally(function () {
          if (window.location && window.location.reload) {
            window.location.reload();
          }
        });
      }
      window.__minaRunScopedSafeRecovery = runScopedSafeRecovery;

      var retryBtn = document.getElementById('boot-retry-btn');
      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          runScopedSafeRecovery();
        });
      }

      window.addEventListener('error', function (ev) {
        if (window.__minaAppMounted) return;
        if (ev && ev.target && ev.target !== window && ev.target.tagName) {
          var cls = classifyResourceError(ev.target);
          if (cls.fatal) {
            showBootFallback(cls.code, cls.url);
          } else {
            recordNonFatalWarning(cls.code, cls.url);
          }
          return;
        }
        if (ev && (ev.message || ev.error)) {
          showBootFallback('BOOT_RUNTIME_ERROR', ev.message || (ev.error && ev.error.message));
        }
      }, true);

      window.addEventListener('unhandledrejection', function (ev) {
        if (window.__minaAppMounted) return;
        var reason = ev && ev.reason;
        var reasonText = reason ? (reason.message || String(reason)) : 'Promise rejected';
        if (isNonFatalBootRejection(reason)) {
          recordNonFatalWarning('BOOT_NONFATAL_REJECTION', reasonText);
          return;
        }
        showBootFallback('BOOT_UNHANDLED_REJECTION', reasonText);
      });

      // Cancellable 12s watchdog (cancelled immediately by markShellCommitted() on valid React commit)
      window.__minaBootWatchdogTimer = setTimeout(function () {
        if (window.__minaAppMounted || window.__minaBootFatalRootCause) return;
        var ms = window.__minaBootMilestones || {};
        var stageHint = ms.moduleEvaluatedAt ? 'module_evaluated_no_commit' : 'entry_module_not_loaded';
        showBootFallback('BOOT_WATCHDOG_TIMEOUT', stageHint);
      }, 12000);

      window.__minaCancelBootWatchdog = function () {
        if (window.__minaBootWatchdogTimer) {
          clearTimeout(window.__minaBootWatchdogTimer);
          window.__minaBootWatchdogTimer = null;
        }
      };

      // Controlled Service Worker lifecycle (zero abrupt reload loops)
      var isNativeWebView =
        window.location.protocol === 'file:' ||
        window.location.hostname === 'appassets.androidplatform.net' ||
        (window.location.hostname === '127.0.0.1' && window.location.port === '8765') ||
        /MinaDentalAndroid/i.test(navigator.userAgent || '');

      if ('serviceWorker' in navigator && !isNativeWebView && window.location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            window.dispatchEvent(
              new CustomEvent('minadental:sw-controllerchange', {
                detail: { buildId: buildId },
              })
            );
          });

          navigator.serviceWorker.addEventListener('message', function (event) {
            if (event && event.data && event.data.type === 'SW_UPDATE_READY') {
              window.dispatchEvent(
                new CustomEvent('minadental:sw-update-available', {
                  detail: { buildId: event.data.buildId || buildId },
                })
              );
            }
          });

          navigator.serviceWorker
            .register('./sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
              if (reg.waiting) {
                window.dispatchEvent(
                  new CustomEvent('minadental:sw-update-available', {
                    detail: { buildId: buildId, registration: reg },
                  })
                );
              }
              reg.addEventListener('updatefound', function () {
                var installing = reg.installing;
                if (!installing) return;
                installing.addEventListener('statechange', function () {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    window.dispatchEvent(
                      new CustomEvent('minadental:sw-update-available', {
                        detail: { buildId: buildId, registration: reg },
                      })
                    );
                  }
                });
              });
            })
            .catch(function (err) {
              recordNonFatalWarning('SW_REGISTER_WARNING', err && err.message ? err.message : 'sw_register_failed');
            });
        });
      }
    })();
  </script>

  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
