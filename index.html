      <style>
        @keyframes auraGlow {

          100% { transform: scale(1.15); opacity: 0.85; }

    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Automatic pre-built bundle loader when served directly from GitHub Pages root branch
      if (window.location.hostname.indexOf('github.io') !== -1) {
        var ghCss = document.createElement('link');
        ghCss.rel = 'stylesheet';
        ghCss.href = './gh-pages-dist/app.css?v=52';
        document.head.appendChild(ghCss);
        var ghJs = document.createElement('script');
        ghJs.type = 'module';
        ghJs.crossOrigin = 'anonymous';
        ghJs.src = './gh-pages-dist/app.js?v=52';
        document.head.appendChild(ghJs);
      }

      // Safe ServiceWorker management
      if ('serviceWorker' in navigator) {
        var isLocalNative = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        if (isLocalNative) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function() {});
          if (window.caches) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            }).catch(function() {});
          }
        } else if (window.location.protocol === 'https:') {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').then(function(reg) {
              reg.update();
            }).catch(function() {});
          });
        }
      }
    </script>
